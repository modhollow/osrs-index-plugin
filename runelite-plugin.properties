displayName=OSRS Index
author=nmill
description=Syncs your whole character to your osrsindex.com account for progression tracking: gear, bank, skills, quests, diaries, combat achievements, collection log, slayer, kill counts, storage and location
tags=tracker,sync,bank,collection log,quests,diary,osrsindex
plugins=com.osrsindex.OsrsIndexPlugin
version=0.5.0
build=standard
warning=This plugin sends your character name, worn equipment, inventory, bank and other item storage, skills, quest, achievement diary, combat achievement, current Slayer assignment and other slayer, clue and minigame progress, collection log, kill counts, Grand Exchange offers, and in-game location to osrsindex.com, a website not controlled or verified by the RuneLite Developers. It sends nothing about your character until you link it to your osrsindex.com account. When you open its Guides tab, it downloads guides from osrsindex.com, linked or not, without sending your character data. Once linked, it also reads sync settings and notices from osrsindex.com, which can pause what is sent or choose which progress values are sent, and it receives the map places you send from your osrsindex.com account and passes them to the Shortest Path plugin, unless you turn off "Receive destinations".
